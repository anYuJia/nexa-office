name: Native Integration Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: native-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-integration:
    name: Native integration / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libfontconfig-dev
          libx11-xcb-dev
          libx11-dev
          libxcb-shape0-dev
          libxcb-xfixes0-dev
          libxcursor-dev
          libxkbcommon-dev
          libxkbcommon-x11-dev

      - name: Verify Rust
        run: rustup show

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Native app tests
        run: cargo test --locked -p nexa-app

      - name: Native app Clippy
        run: cargo clippy --locked -p nexa-app --all-targets -- -D warnings

      - name: Validate Linux and macOS packaging scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n packaging/linux/package.sh
          bash -n packaging/macos/package.sh

      - name: Validate packaging XML
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          for path in [
              "packaging/linux/nexa-office.xml",
              "packaging/macos/Info.plist",
              "packaging/windows/nexa-office.manifest",
              "packaging/windows/nexa-office.wxs",
          ]:
              ET.parse(path)
              print("ok", path)

      - name: Build release app
        run: cargo build --release --locked -p nexa-app

      - name: Enforce executable size
        shell: python
        run: |
          from pathlib import Path
          candidates = [Path("target/release/nexa-office"), Path("target/release/nexa-office.exe")]
          binary = next(path for path in candidates if path.exists())
          size = binary.stat().st_size
          print(f"release_binary_bytes={size}")
          assert size <= 25 * 1024 * 1024, f"release binary exceeds 25 MiB gate: {size}"
