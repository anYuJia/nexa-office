name: Release Hardening Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify required release documents
        shell: python
        run: |
          from pathlib import Path
          required = [
              "docs/SUPPORT_MATRIX.md",
              "docs/KNOWN_LIMITATIONS.md",
              "docs/RELEASE_CHECKLIST.md",
              "docs/CRASH_REPORTING.md",
              "docs/REPRODUCIBLE_BUILDS.md",
              "SECURITY.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          assert not missing, f"missing release docs: {missing}"

      - name: Validate release scripts
        run: |
          python -m py_compile scripts/release/artifact_manifest.py
          python -m py_compile scripts/release/verify_version.py
          python -m py_compile scripts/ci/long_session_smoke.py
          python scripts/release/verify_version.py 0.1.0

      - name: Validate package metadata
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          for path in [
              "packaging/linux/nexa-office.xml",
              "packaging/macos/Info.plist",
              "packaging/windows/nexa-office.manifest",
              "packaging/windows/nexa-office.wxs",
          ]:
              ET.parse(path)
              print("ok", path)

  soak:
    name: Linux bounded soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install native dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          xvfb
          libfontconfig-dev
          libx11-xcb-dev
          libx11-dev
          libxcb-shape0-dev
          libxcb-xfixes0-dev
          libxcursor-dev
          libxkbcommon-dev
          libxkbcommon-x11-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release shell
        run: cargo build --release --locked -p nexa-app

      - name: Run bounded leak smoke
        shell: bash
        env:
          NEXA_SOAK_WARMUP_SECONDS: "10"
          NEXA_SOAK_SAMPLE_SECONDS: "45"
          NEXA_SOAK_MAX_GROWTH_MIB: "25"
        run: |
          Xvfb :99 -screen 0 1280x800x24 > /tmp/nexa-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          python scripts/ci/long_session_smoke.py target/release/nexa-office

  package-scripts:
    name: Package scripts / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n packaging/linux/package.sh
          bash -n packaging/macos/package.sh

      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path packaging/windows/package.ps1),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
