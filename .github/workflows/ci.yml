name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-quality:
    name: Rust quality / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libfontconfig-dev
          libx11-xcb-dev
          libx11-dev
          libxcb-shape0-dev
          libxcb-xfixes0-dev
          libxcursor-dev
          libxkbcommon-dev
          libxkbcommon-x11-dev
          xinput

      - name: Verify pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve dependency lockfile
        run: cargo generate-lockfile

      - name: Bootstrap Cargo.lock into the Phase 1 branch
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: lock Phase 1 dependencies"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets
