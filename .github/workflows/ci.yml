name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-quality:
    name: Rust quality / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libfontconfig-dev
          libx11-xcb-dev
          libx11-dev
          libxcb-shape0-dev
          libxcb-xfixes0-dev
          libxcursor-dev
          libxkbcommon-dev
          libxkbcommon-x11-dev
          xinput

      - name: Verify pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Refresh lockfile for renderer dependency change
        if: runner.os == 'Linux'
        run: |
          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh lockfile for software renderer"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Verify lockfile
        if: runner.os != 'Linux'
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked
