name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-quality:
    name: Rust quality / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libfontconfig-dev
          libx11-xcb-dev
          libx11-dev
          libxcb-shape0-dev
          libxcb-xfixes0-dev
          libxcursor-dev
          libxkbcommon-dev
          libxkbcommon-x11-dev
          xinput

      - name: Verify pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve dependency lockfile
        run: cargo generate-lockfile

      - name: Upload generated lockfile
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: phase-1-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets
