name: Bootstrap Cargo Lock

on:
  push:
    branches:
      - feat/phase-2-ooxml-opc

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase-2-ooxml-opc

      - name: Resolve ZIP dependency into Cargo.lock
        shell: bash
        run: |
          set +e
          cargo check -p nexa-ooxml
          check_status=$?
          set -e

          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build: lock minimal ZIP dependency"
            git push origin "HEAD:feat/phase-2-ooxml-opc"
          fi

          exit "$check_status"
