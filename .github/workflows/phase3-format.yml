name: Phase 3 Format Bootstrap

on:
  push:
    branches:
      - feat/phase-3-docs-mvp

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase-3-docs-mvp

      - name: Verify pinned toolchain
        run: rustup show

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nexa-docs crates/nexa-ooxml
          git commit -m "style: apply rustfmt to Phase 3 Docs"
          git push origin "HEAD:feat/phase-3-docs-mvp"
